name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1

      - name: Install SDL2
        run: sudo apt-get install -y libsdl2-dev

      - name: Build firmware
        run: |
          make mpy-cross
          make disco
          make empty
          make unix

      - name: Run tests
        run: make test

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/upy-f469disco.bin
            bin/upy-f469disco-empty.bin
