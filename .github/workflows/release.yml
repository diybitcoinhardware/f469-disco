name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build firmware
        run: |
          nix develop -c make mpy-cross
          nix develop -c make disco
          nix develop -c make empty
          nix develop -c make unix

      - name: Run tests
        run: nix develop -c make test

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/upy-f469disco.bin
            bin/upy-f469disco-empty.bin
