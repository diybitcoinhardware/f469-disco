name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  disco-tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run unit tests
        run: pytest scripts/disco_lib/tests/unit -v

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build firmware
        run: |
          nix develop -c make mpy-cross
          nix develop -c make disco
          nix develop -c make empty
          nix develop -c make unix

      - name: Run tests
        run: nix develop -c make test

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            bin/upy-f469disco.bin
            bin/upy-f469disco-empty.bin
